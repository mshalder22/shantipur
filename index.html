<style>

*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:var(--bg);color:var(--text);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;line-height:1.5}
.hero{margin:12px 14px 0;padding:20px 18px;border-radius:22px;background:linear-gradient(135deg,#0b3a2c,#136b4f 60%,#b8892f);color:#fff}
.hero h1{margin:0;font-size:27px}.hero p{margin:4px 0 8px;opacity:.9;font-size:14px}.stat{font-size:13px;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{border:0;padding:8px 13px;border-radius:20px;font:inherit;font-size:13px;cursor:pointer;background:#fff;color:#0b3a2c;font-weight:600}.pill.ghost{background:rgba(255,255,255,.2);color:#fff}
.ad{margin:12px 14px 0;border-radius:18px;padding:14px 16px;background:linear-gradient(120deg,#1b1b1b,#3a2e12);color:#f6e7bf;border:1px solid #b8892f;position:relative;min-height:84px}
.ad .tag{position:absolute;top:8px;right:12px;font-size:11px;letter-spacing:1px;color:#e0b25a;border:1px solid #e0b25a;border-radius:8px;padding:0 6px}
.ad h3{margin:0 0 2px;font-size:17px;color:#ffd978}.ad p{margin:0;font-size:13px;opacity:.9}.ad a{color:#ffd978;font-size:13px}
.bar{padding:12px 14px 4px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font:inherit}
.tabs{display:flex;gap:8px;padding:6px 14px;overflow-x:auto}
.tab{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--chip);color:var(--text);font:inherit;cursor:pointer}
.tab.on{background:var(--green);color:#fff;border-color:var(--green)}.tab.sub{font-size:13px;padding:5px 12px;background:transparent}.tab.sub.on{background:var(--gold);border-color:var(--gold);color:#fff}
#list{padding:8px 14px 40px;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h3{margin:0;font-size:17px}.meta{color:var(--muted);font-size:13px}.card p{margin:6px 0 10px;font-size:14px}
.btns{display:flex;gap:8px}
.btns a,.btns button{flex:1;text-align:center;padding:9px;border-radius:10px;border:0;text-decoration:none;font:inherit;font-size:14px;background:var(--green);color:#fff;cursor:pointer}
.btns .alt{background:var(--chip);color:var(--text)}.btns .no{background:#9b2c2c}
.sample{font-size:11px;color:var(--gold)}.empty{text-align:center;color:var(--muted);padding:24px}
.next{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}.tm{font-size:20px;font-weight:700}.note{margin:4px 14px;font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 24px}
.sheet h2{margin:0 0 10px;font-size:20px}.sheet label{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;display:none;max-width:90%}
</style>
</head>

    try{isAdmin=(await getDoc(doc(db,"admins",u.uid))).exists()}catch(e){}
    unsubs.push(snap(isAdmin?query(collection(db,"notices"),orderBy("ts","desc"),limit(50)):query(collection(db,"notices"),where("to","==",u.uid)),a=>{notices=a;texts()}));
    if(isAdmin){
      try{const s=await getDoc(doc(db,"stats","main"));if(!s.exists())await setDoc(doc(db,"stats","main"),{users:0,taps:0})}catch(e){}
      unsubs.push(snap(query(collection(db,"submissions"),orderBy("ts","asc")),a=>{pending=a;texts()}));
    }
  }
  render();renderAd();
});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
